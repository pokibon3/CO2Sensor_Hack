[common]
platform = https://github.com/ArteryTek/platform-arterytekat32.git
board = genericAT32F415CBT7
framework = at32firmlib
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
build_flags = -I${PROJECT_DIR}/include -O2
build_unflags = -Os

; ALIEN RAID (default)
[env:at32f415cbt7]
extends = common
build_src_filter = +<*> -<sflash_tool.c>

; W25Q32 read/erase/program tool, driven over SWD by tools/sflash.py
[env:sflash]
extends = common
build_src_filter = +<board.c> +<lt7680.c> +<sflash_tool.c>
